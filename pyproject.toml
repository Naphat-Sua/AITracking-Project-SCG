[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aitracking"
dynamic = ["version"]
description = "Real-time object detection, tracking and counting (people, vehicles...) for video files, webcams and CCTV/RTSP streams, with a live web dashboard."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.24"]

[project.scripts]
aitrack = "aitracking.cli:main"

[tool.setuptools]
packages = ["aitracking", "aitracking.static"]

[tool.setuptools.package-data]
"aitracking.static" = ["*.html"]

[tool.setuptools.dynamic]
version = { attr = "aitracking.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"
# Vendored third-party code is kept close to upstream and not linted
extend-exclude = [
    "lessons/Text-Detection",
    "lessons/Setup/PY-Setup.py",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, W: warnings
select = ["E", "F", "W"]
ignore = [
    "E501",  # long lines: teaching code keeps long explanatory comments
    "E402",  # module import not at top: several lessons import mid-file on purpose
    "E701",  # multiple statements on one line (compact axis-label lines)
    "E741",  # ambiguous variable names like `l` used in math-heavy snippets
    "W191",  # legacy lesson files are tab-indented; don't rewrite them wholesale
    "W291",  # trailing whitespace in legacy files
    "W293",  # whitespace on blank lines in legacy files
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
